<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Máquinas - Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
         <!-- Menu Topo -->
      <header>

         <section class="contentHeader">
                <h1>MC - MÁQUINAS</h1>
				<nav>
                  <ul>
                     <li><a href="index.html">Home</a></li>
                     <li><a href="contato.html">Contato</a></li>
                  </ul>
                </nav>
         </section>

      </header>

      <main class="contentMain paginaCadastro">
        <h1>Cadastre-se</h1>

          <section>
            <form id="meuFormulario">
              <article class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" />
              </article>
              <article class="form-group">
                <label for="telefone">Telefone</label>
                <input type="number" id="telefone" />
              </article>
              <article>
                <label for="sexo">Sexo</label>
                <select name="" id="sexo">
                <option value="m">Masculino</option>
                <option value="f">Feminino</option>
                </select>
              </article>

              <article>
                <h1>Deseja receber informações?</h1>
                <label for="s">Sim</label>
                <input type="checkbox" id="s" />
              </article>

              <article class="form-group">
                <button type="submit">Enviar</button>
              </article>
              <a href="cadastro.html" class="cadastro">Não tem uma conta? Cadastre-se</a>             
            </form>
          </section>
          <script src="./js/validacao.js"></script>
         <!-- Rodapé -->
        <footer>
            <p>@ 2026 MC Máquinas</p>
        </footer>
         </main>
         </body>
         </html>
